<header class="navigation">
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-white bg-transparent border-bottom pl-0">
      <a class="navbar-brand mobile-view" href="{{ .Site.BaseURL }}"><div class="navbar-title">{{ .Site.Title }}</div></a>
      <button class="navbar-toggler border-0" type="button" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
        {{ partial "icon.html" "menu" }}
      </button>
      <div class="collapse navbar-collapse text-center" id="navigation">
        <div class="desktop-view">
          <ul class="navbar-nav mr-auto">
            {{ range .Site.Params.social }}
            <li class="nav-item">
              <a class="nav-link" href="{{ .link }}" target="_blank" rel="noopener" aria-label="{{ .title }}">{{ partial "icon.html" .title }}</a>
            </li>
            {{ end }}
          </ul>
        </div>
        <a class="navbar-brand mx-auto desktop-view" href="{{ .Site.BaseURL }}"><div class="navbar-title">{{ .Site.Title }}</div></a>
        <ul class="navbar-nav">
          {{ range .Site.Menus.main }}
          <li class="nav-item"><a class="nav-link" href="{{ .URL | absURL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </div>
    </nav>
  </div>
</header>
