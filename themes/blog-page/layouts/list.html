{{ define "main" }}

<!-- blog post -->
<section class="section-sm">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 mb-5 mb-lg-0">
        <h1 class="h2 mb-4">{{ if eq .Kind "term" }}{{ .Title | humanize }}{{ else }}{{ .Title | markdownify }}{{ end }}</h1>
        <div class="row">
          {{ $paginator := .Paginate .Pages }}
          {{ range $paginator.Pages }}
          {{ partial "post-card.html" . }}
          {{ end }}
        </div>
      </div>
      <!-- sidebar -->
      {{ partial "sidebar.html" . }}
      <!-- /sidebar -->

      <!-- pagination -->
      <div class="col-12 mt-5">
        {{ partial "pagination.html" . }}
      </div>
    </div>
  </div>
</section>
<!-- /blog post -->

{{ end }}
